name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    uses: unmango/actions/.github/workflows/release-please.yml@389dda3b9e44477f790e76d5474b700c1bb9b82d # v1.3.0
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      # An app token rather than GITHUB_TOKEN, whose tags don't start the
      # goreleaser workflow.
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
